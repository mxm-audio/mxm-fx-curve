[package]
name = "mxm-fx-curve"
description = "A serial memoryless and detector transfer-curve CLAP effect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
egui.workspace = true
nice-plug.workspace = true
nice-plug-egui.workspace = true
mxm-fx-curve-dsp.workspace = true
mxm-ui.workspace = true
mxm-preset.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"

[dev-dependencies]
# The collection's shared headless checks (`crates/mxm-plugin-test`).
mxm-plugin-test.workspace = true
# The control-map schema and standard, for the test of what this effect's map fills.
mxm-control-map.workspace = true
nice-assert-no-alloc = "=1.0.0"
# `wgpu` renders a frame to pixels for the layout-tree review pictures
# (`mxm_plugin_test::tree_checks`, `editor::tests::tree_pictures`). Test-only: nothing here reaches
# the bundle.
egui_kittest = { version = "=0.36.1", features = ["wgpu"] }
image = { version = "=0.25.9", default-features = false, features = ["png"] }
